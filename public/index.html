<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | Projeto Integrador VI</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="tag">Projeto Integrador VI</span><h1>Produtos</h1><p>Cadastre e gerencie seus produtos.</p></header>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Novo produto</h2>
      <form id="produto-form">
        <div><label for="nome">Nome</label><input id="nome" name="nome" required maxlength="100" placeholder="Ex.: Teclado"></div>
        <div><label for="preco">Preço (R$)</label><input id="preco" name="preco" type="number" min="0" step="0.01" required placeholder="0,00"></div>
        <div class="actions"><button id="salvar" type="submit">Cadastrar</button><button id="cancelar" class="secondary" type="button" hidden>Cancelar edição</button></div>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>
    <section class="card" aria-labelledby="list-title">
      <div class="section-header"><h2 id="list-title">Lista de produtos</h2><button id="recarregar" class="secondary" type="button">Atualizar lista</button></div>
      <p id="vazio" hidden>Nenhum produto cadastrado. Adicione o primeiro acima.</p>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="produtos"></tbody></table></div>
    </section>
  </main>
</body>
</html>
